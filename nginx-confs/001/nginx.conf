# Nginx configuration for serving two different directories on different ports

# Define the user and worker processes
# user nginx;
worker_processes auto;

# Error logging
# error_log /var/log/nginx/error.log;
# pid /var/run/nginx.pid;

# Events configuration
events {
    worker_connections 1024;
}

# HTTP server configuration
http {
    # MIME type definitions
    include mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" '
                   '"$http_user_agent" "$http_x_forwarded_for"';

    access_log logs/access.log main;

    # Sendfile configuration
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;

    # Server block for port 41962 - serving front directory
    server {
        listen 41962;
        server_name localhost;

        # Root directory for port 41962
        root D:\imensa\projects\uat;
        index index.html index.htm;

        # Serve static files
        location / {
            try_files $uri $uri/ =404;
        }

         location  /imensa/ {
             client_max_body_size 60M;
   		 	 client_body_buffer_size 60M;
             proxy_pass https://uat.trialos.com.cn/imensa/;
        }
        location  /api/bigdata-datart/ {
           client_max_body_size 60M;
   		   client_body_buffer_size 60M;
           proxy_pass https://uat.trialos.com.cn/api/bigdata-datart/;
       }
        location  /api/dify-api/ {
           client_max_body_size 60M;
           client_body_buffer_size 60M;
           proxy_pass https://uat.trialos.com.cn/api/dify-api/;
       }

        # Error pages
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        
        location = /50x.html {
            root /usr/share/nginx/html;
        }
        
    }

    # Server block for port 41963 - serving front_react/mp directory
    server {
        listen 41963;
        server_name localhost;

        # Root directory for port 41963
        root D:\imensa\projects\prd;
        index index.html index.htm;

        # Serve static files
        location / {
            try_files $uri $uri/ =404;
        }

        location  /imensa/ {
            client_max_body_size 60M;
            client_body_buffer_size 60M;
            proxy_pass https://www.trialos.com.cn/imensa/;
        }
        location  /api/bigdata-datart/ {
           client_max_body_size 60M;
           client_body_buffer_size 60M;
           proxy_pass https://www.trialos.com.cn/api/bigdata-datart/;
       }
        location  /api/dify-api/ {
           client_max_body_size 60M;
           client_body_buffer_size 60M;
           proxy_pass https://www.trialos.com.cn/api/dify-api/;
       }

        # Error pages
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}